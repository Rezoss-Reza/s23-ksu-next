name: Prepare local ZeroMount patches

on:
  push:
    branches:
      - chatgpt/zeromount-local-patches
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/zeromount-local-patches
          fetch-depth: 0

      - name: Download pinned patch set
        shell: bash
        run: |
          set -euo pipefail
          PATCH_DIR="patches/zeromount"
          SOURCE_BASE="https://raw.githubusercontent.com/Enginex0/Super-Builders/c2cb71614868fe742cbffee2b6f3126523432673/android13-5.15/KernelSU-Next/patches"
          mkdir -p "$PATCH_DIR"
          for PATCH_NAME in \
            50_add_susfs_in_gki-android13-5.15.patch \
            51_enhanced_susfs-android13-5.15.patch \
            60_zeromount-android13-5.15.patch \
            70_ksu_safety-kernelsu-next-5.15.patch
          do
            echo "Downloading $PATCH_NAME"
            curl -fsSL "$SOURCE_BASE/$PATCH_NAME" -o "$PATCH_DIR/$PATCH_NAME"
          done

      - name: Adapt patch 50 for Samsung namespace.c
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("patches/zeromount/50_add_susfs_in_gki-android13-5.15.patch")
          text = p.read_text()
          section_marker = "diff '--color=auto' -ruN clean/fs/namespace.c post-upstream/fs/namespace.c"
          before, sep, section = text.partition(section_marker)
          if not sep:
              raise SystemExit("namespace section not found")

          old_header = "@@ -32,10 +32,22 @@"
          if old_header not in section:
              raise SystemExit("namespace hunk header not found")
          section = section.replace(old_header, "@@ -32,11 +32,23 @@", 1)

          anchor = ' #include "internal.h"\n'
          pos = section.find(anchor)
          if pos < 0:
              raise SystemExit("internal.h anchor not found")
          pos += len(anchor)
          section = section[:pos] + ' #include <trace/hooks/blk.h>\n' + section[pos:]
          p.write_text(before + sep + section)
          print("patch 50 adapted")
          PY

      - name: Adapt patch 70 for current KernelSU-Next
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path("patches/zeromount/70_ksu_safety-kernelsu-next-5.15.patch")
          text = p.read_text()

          su_marker = "diff -ruN '--exclude=include' clean-kernel/feature/sucompat.c work-kernel/feature/sucompat.c"
          before, sep, tail = text.partition(su_marker)
          if not sep:
              raise SystemExit("sucompat section not found")

          old_header = "@@ -118,6 +125,130 @@"
          if old_header not in tail:
              raise SystemExit("sucompat hunk header not found")
          tail = tail.replace(old_header, "@@ -118,6 +125,135 @@", 1)

          anchor = "+static const char ksud_path[] = KSUD_PATH;\n"
          pos = tail.find(anchor)
          if pos < 0:
              raise SystemExit("ksud_path anchor not found")
          pos += len(anchor)
          helper = (
              "+\n"
              "+static char __user *sh_user_path(void)\n"
              "+{\n"
              "+\treturn userspace_stack_buffer(sh_path, sizeof(sh_path));\n"
              "+}\n"
          )
          tail = tail[:pos] + helper + tail[pos:]
          text = before + sep + tail

          super_marker = "diff -ruN '--exclude=include' clean-kernel/supercall/supercall.c work-kernel/supercall/supercall.c"
          before, sep, tail = text.partition(super_marker)
          if not sep:
              raise SystemExit("supercall section not found")

          old_header = "@@ -239,18 +365,24 @@"
          if old_header not in tail:
              raise SystemExit("supercall tail hunk header not found")
          tail = tail.replace(old_header, "@@ -239,16 +365,22 @@", 1)

          obsolete = "     sulog_init_heap(); // grab heap memory\n"
          if obsolete not in tail:
              raise SystemExit("sulog_init_heap context not found")
          tail = tail.replace(obsolete, "", 1)
          p.write_text(before + sep + tail)
          print("patch 70 adapted")
          PY

      - name: Verify generated patch set
        shell: bash
        run: |
          set -euo pipefail
          P50="patches/zeromount/50_add_susfs_in_gki-android13-5.15.patch"
          P70="patches/zeromount/70_ksu_safety-kernelsu-next-5.15.patch"

          grep -F ' #include <trace/hooks/blk.h>' "$P50"
          if grep -Fq '+#include <trace/hooks/blk.h>' "$P50"; then
            echo "::error::trace/hooks/blk.h is still being added instead of used as Samsung context"
            exit 1
          fi
          grep -F '+static char __user *sh_user_path(void)' "$P70"
          if grep -Fq 'sulog_init_heap(); // grab heap memory' "$P70"; then
            echo "::error::obsolete supercall context still present"
            exit 1
          fi
          echo "Generated patch set verified."

      - name: Commit generated patch set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patches/zeromount
          if git diff --cached --quiet; then
            echo "Patch set already matches generated result."
            exit 0
          fi
          git commit -m "Regenerate Samsung-adapted ZeroMount patches"
          git push origin HEAD:chatgpt/zeromount-local-patches
